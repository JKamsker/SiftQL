name: ci

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip
  CONFIGURATION: Release
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test-pack:
    name: Build, test, pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: ${ver}"

      - name: Restore
        run: dotnet restore SiftQL.slnx

      - name: Build
        run: dotnet build SiftQL.slnx -c $CONFIGURATION --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: |
          dotnet test tests/Generators.Tests/Generators.Tests.csproj \
            -c $CONFIGURATION --no-build --logger "trx;LogFileName=test-results.trx" \
            --results-directory artifacts/test-results

      - name: Pack
        run: |
          mkdir -p artifacts/nupkg
          for proj in \
              src/Abstractions/Abstractions.csproj \
              src/SiftQL/SiftQL.csproj; do
            dotnet pack "$proj" -c $CONFIGURATION --no-build -o artifacts/nupkg \
              -p:Version=${{ steps.version.outputs.version }}
          done
          ls -lah artifacts/nupkg

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  publish-nuget:
    name: Publish to NuGet.org
    needs: build-test-pack
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.repository == 'JKamsker/SiftQL' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nupkg

      - name: Fetch NuGet API key from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            265b2fb6-2cf0-4859-9bc8-b24c00ab4378 > NUGET_API_KEY

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "artifacts/nupkg/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "Published version: ${{ needs.build-test-pack.outputs.version }}"
